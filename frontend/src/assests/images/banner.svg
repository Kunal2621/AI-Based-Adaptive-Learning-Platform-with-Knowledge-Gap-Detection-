<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <defs>
    <style>
      .logo-text-bold {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 72px;
        letter-spacing: -2px;
      }
      .logo-text-regular {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 72px;
        letter-spacing: -1px;
      }
      .color-blue {
        fill: #19467c;
      }
      .color-orange {
        fill: #f28b31;
      }
    </style>
  </defs>

  <!-- Complete Text in One Line with Dynamic Canvas -->
  <g transform="translate(20, 85)">
    <!-- "knowledge" in Bold Blue -->
    <text x="0" y="0" class="logo-text-bold color-blue">knowledge</text>
    
    <!-- ".guru" in Orange placed right after "knowledge" -->
    <text x="350" y="0" class="logo-text-regular color-orange">.guru</text>
  </g>
</svg>
